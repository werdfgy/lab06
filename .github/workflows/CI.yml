name: CMake

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: project_configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: project_build
        run: cmake --build build --config Release

      - name: solver_test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: echo "1 -5 6" | ./build/bin/solver
        shell: bash

      - name: solver_test (Windows)
        if: matrix.os == 'windows-latest'
        run: echo "1 -5 6" | .\build\bin\solver.exe
        shell: pwsh
